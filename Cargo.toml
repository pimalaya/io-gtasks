[package]
name = "io-gtasks"
description = "Google Tasks REST API client library for Rust"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "no-std"]
keywords = ["io-free", "no-std", "coroutine", "google", "tasks"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-gtasks/latest/io_gtasks"
repository = "https://github.com/pimalaya/io-gtasks"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-ring"]
client = []
rustls-ring = ["client", "pimalaya-stream/rustls-ring", "dep:anyhow", "dep:pimalaya-stream"]
rustls-aws = ["client", "pimalaya-stream/rustls-aws", "dep:anyhow", "dep:pimalaya-stream"]
native-tls = ["client", "pimalaya-stream/native-tls", "dep:anyhow", "dep:pimalaya-stream"]
vendored = ["pimalaya-stream?/vendored"]
ical = ["dep:ical-rs", "dep:jiff"]

[[example]]
name = "std_gtasks"
path = "examples/std_gtasks.rs"
required-features = ["rustls-ring"]

[dev-dependencies]
env_logger = "0.11"
io-oauth = { version = "0.5", default-features = false, features = ["jwt-bearer", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
rustls-platform-verifier = "0.7"
secrecy = { version = "0.10", default-features = false }

[dependencies]
anyhow = { version = "1", optional = true }
ical-rs = { version = "0.7", default-features = false, features = ["parser"], optional = true }
io-http = { version = "0.6", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["alloc"], optional = true }
log = { version = "0.4", default-features = false }
pimalaya-stream = { version = "0.3", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
url = { version = "2.5", default-features = false, features = ["serde"] }
